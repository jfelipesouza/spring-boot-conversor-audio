spring:
  application:
    name: media-converter
  jackson:
    deserialization:
      fail-on-unknown-properties: true

server:
  port: ${SERVER_PORT:8080}

app:
  converter:
    temp-directory: ${CONVERTER_TEMP_DIRECTORY:${java.io.tmpdir}/media-converter}
    timeout: ${CONVERTER_TIMEOUT:10m}
    max-file-size: ${CONVERTER_MAX_FILE_SIZE:104857600}
    max-concurrent: ${CONVERTER_MAX_CONCURRENT:2}
    yt-dlp-executable: ${YT_DLP_EXECUTABLE:yt-dlp}
    ffmpeg-executable: ${FFMPEG_EXECUTABLE:ffmpeg}
    ffprobe-executable: ${FFPROBE_EXECUTABLE:ffprobe}
  storage:
    connection-string: ${AZURE_STORAGE_CONNECTION_STRING:DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://127.0.0.1:11000/devstoreaccount1;}
    container: ${AZURE_STORAGE_CONTAINER:audios}
  download:
    base-url: ${DOWNLOAD_BASE_URL:http://localhost:8080}
    validity: ${DOWNLOAD_LINK_VALIDITY:24h}
    max-links: ${DOWNLOAD_MAX_LINKS:10000}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html